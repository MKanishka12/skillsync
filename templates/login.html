{% extends 'base.html' %}
{% block title %}Log in{% endblock %}
{% block content %}
<section class="wrap auth-wrap">
  <div class="auth-card">
    <h1>Welcome back</h1>
    <p class="muted">Log in to see your matches and projects.</p>
    {% if error %}<div class="flash flash-error">{{ error }}</div>{% endif %}
    <form method="post" class="form">
      <label>Email
        <input type="email" name="email" value="{{ email }}" required autofocus autocomplete="email">
      </label>
      <label>Password
        <input type="password" name="password" required autocomplete="current-password">
      </label>
      <button class="btn btn-primary btn-lg btn-block" type="submit">Log in</button>
    </form>
    <p class="auth-alt">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
  </div>
</section>
{% endblock %}
